[project]
name = "gridxray"
version = "0.1.0"
description = "Physical AI for Utilities: an agent that discovers hidden power-grid topology through virtual experiments."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandapower>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sse-starlette>=2.1",
    "numba>=0.68.0",
    "openai>=3.39.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
gridxray = "gridxray.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridxray"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
