# GridXray: `docker compose up --build`, then open http://localhost:8080
# Requires backend/.env with META_API_KEY (see .env.example).
services:
  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "8000:8000"   # API + OpenAPI docs at http://localhost:8000/docs
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
