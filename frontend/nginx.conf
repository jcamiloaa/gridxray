server {
    listen 80;
    root /usr/share/nginx/html;

    # Same path the Vite dev proxy uses, so the app code is identical in dev and in Docker.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Investigation events stream over SSE: don't buffer, allow long-lived connections.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
